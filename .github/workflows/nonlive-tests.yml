name: Non-live tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Preserve a finite margin around the complete supported-profile gate.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install application and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[chatgpt-plan]' pytest
      - name: Scheduled workflow acceptance gate
        run: python -m pytest -q --durations=10 -m 'scheduled_acceptance and not document_qualification and not live' tests
      - name: Run remaining non-live suite
        run: python -m pytest -q -m 'not live and not scheduled_acceptance and not document_qualification' tests

  test-openbb:
    runs-on: ubuntu-latest
    # Preserve the same bounded acceptance in the pinned optional-SDK environment.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned optional SDK environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci-openbb.txt -e '.[chatgpt-plan,openbb,commodities]'
          python -m pip check
          openbb-build
      - name: Scheduled workflow acceptance gate with OpenBB installed
        run: python -m pytest -q --durations=10 -m 'scheduled_acceptance and not document_qualification and not live' tests
      - name: Run remaining non-live suite with OpenBB installed
        run: python -m pytest -q -m 'not live and not scheduled_acceptance and not document_qualification' tests
