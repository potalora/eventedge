name: Non-live tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The last accepted hosted run took 47 minutes before the additional
    # full-corpus graphics workflow gate. Keep a finite completion margin.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install application and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[chatgpt-plan]' pytest
      - name: Scheduled workflow acceptance gate
        run: python -m pytest -q -m 'scheduled_acceptance and not live' tests
      - name: Run remaining non-live suite
        run: python -m pytest -q -m 'not live and not scheduled_acceptance' tests

  test-openbb:
    runs-on: ubuntu-latest
    # The last accepted pinned-SDK run took 52 minutes before the additional
    # full-corpus graphics workflow gate.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned optional SDK environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci-openbb.txt -e '.[chatgpt-plan,openbb,commodities]'
          python -m pip check
          openbb-build
      - name: Scheduled workflow acceptance gate with OpenBB installed
        run: python -m pytest -q -m 'scheduled_acceptance and not live' tests
      - name: Run remaining non-live suite with OpenBB installed
        run: python -m pytest -q -m 'not live and not scheduled_acceptance' tests
