name: Non-live tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install application and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run non-live suite
        run: python -m pytest -q -m 'not live' tests
      - name: Replay recorded NOAA yearly files
        run: python scripts/verify_noaa_yearly_source.py --report /tmp/eventedge-noaa-yearly.json
      - name: Retain NOAA yearly replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noaa-yearly-replay-standard
          path: /tmp/eventedge-noaa-yearly.json
          retention-days: 14
