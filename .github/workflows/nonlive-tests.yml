name: Non-live tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Runs compileall, historical replay, and remaining non-live suite in parallel with scheduled-acceptance.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install application and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[chatgpt-plan]' pytest
      - name: Guard against accidental large tracked files (>500 KiB)
        run: |
          python - <<'PY'
          import os, subprocess, sys
          ALLOW = {"uv.lock"}
          LIMIT = 500 * 1024
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          bad = [
              (p.decode(), os.path.getsize(p))
              for p in tracked
              if p and p.decode() not in ALLOW and os.path.getsize(p) > LIMIT
          ]
          if bad:
              for path, size in sorted(bad, key=lambda x: -x[1]):
                  print(f"ERROR: tracked file exceeds 500 KiB ({size} bytes): {path}", file=sys.stderr)
              sys.exit(1)
          print("OK: all tracked files (excluding uv.lock) are <= 500 KiB")
          PY
      - name: Compile-check application and scripts
        run: python -m compileall -q tradingagents scripts
      - name: Replay recorded public historical sources
        run: python scripts/run_historical_source_acceptance.py --report /tmp/eventedge-public-historical-acceptance.json
      - name: Retain public historical replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-historical-acceptance-standard
          path: /tmp/eventedge-public-historical-acceptance.json
          retention-days: 14
      - name: Run remaining non-live suite
        run: python -m pytest -q -m 'not live and not scheduled_acceptance and not document_qualification' tests

  scheduled-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install application and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[chatgpt-plan]' pytest
      - name: Scheduled workflow acceptance gate
        run: python -m pytest -q --durations=10 -m 'scheduled_acceptance and not document_qualification and not live' tests
