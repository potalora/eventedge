name: Non-live tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install application and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[chatgpt-plan]' pytest
      - name: Run non-live suite
        run: python -m pytest -q -m 'not live' tests

  test-openbb:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install locked optional SDK environment
        run: |
          python -m pip install uv==0.12.10
          uv sync --frozen --all-extras --no-install-project
          uv pip install --no-deps -e .
          uv pip install pytest
          uv pip check
          .venv/bin/openbb-build
      - name: Run non-live suite with OpenBB installed
        run: .venv/bin/python -m pytest -q -m 'not live' tests
