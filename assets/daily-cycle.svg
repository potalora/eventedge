<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
  </defs>
  <rect width="800" height="330" rx="12" fill="url(#bg3)"/>
  <text x="400" y="34" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="bold">Exact-session Daily Cycle</text>
  <text x="400" y="52" text-anchor="middle" fill="#7d8590" font-size="11">18:00 ET wakeup; Python requires the exact XNYS session</text>

  <g transform="translate(25,82)">
    <rect width="130" height="78" rx="8" fill="#1a2332" stroke="#7d8590" stroke-width="1.5"/>
    <text x="65" y="23" text-anchor="middle" fill="#e6edf3" font-size="10" font-weight="bold">Validate</text>
    <line x1="14" y1="33" x2="116" y2="33" stroke="#30363d"/>
    <text x="65" y="50" text-anchor="middle" fill="#8b949e" font-size="8">exact raw bars</text>
    <text x="65" y="64" text-anchor="middle" fill="#8b949e" font-size="8">actions + benchmarks</text>
  </g>
  <line x1="155" y1="121" x2="172" y2="121" stroke="#30363d" stroke-width="1.5"/><polygon points="178,121 170,116 170,126" fill="#30363d"/>

  <g transform="translate(180,82)">
    <rect width="130" height="78" rx="8" fill="#1a2332" stroke="#f0883e" stroke-width="1.5"/>
    <text x="65" y="23" text-anchor="middle" fill="#f0883e" font-size="10" font-weight="bold">Execute + Mark</text>
    <line x1="14" y1="33" x2="116" y2="33" stroke="#30363d"/>
    <text x="65" y="50" text-anchor="middle" fill="#8b949e" font-size="8">exits before entries</text>
    <text x="65" y="64" text-anchor="middle" fill="#8b949e" font-size="8">costs, marks, snapshot</text>
  </g>
  <line x1="310" y1="121" x2="327" y2="121" stroke="#30363d" stroke-width="1.5"/><polygon points="333,121 325,116 325,126" fill="#30363d"/>

  <g transform="translate(335,82)">
    <rect width="130" height="78" rx="8" fill="#1a2332" stroke="#79c0ff" stroke-width="1.5"/>
    <text x="65" y="23" text-anchor="middle" fill="#79c0ff" font-size="10" font-weight="bold">Fetch + Screen</text>
    <line x1="14" y1="33" x2="116" y2="33" stroke="#30363d"/>
    <text x="65" y="50" text-anchor="middle" fill="#8b949e" font-size="8">shared event evidence</text>
    <text x="65" y="64" text-anchor="middle" fill="#8b949e" font-size="8">four horizon screens</text>
  </g>
  <line x1="465" y1="121" x2="482" y2="121" stroke="#30363d" stroke-width="1.5"/><polygon points="488,121 480,116 480,126" fill="#30363d"/>

  <g transform="translate(490,82)">
    <rect width="130" height="78" rx="8" fill="#1a2332" stroke="#7ee787" stroke-width="1.5"/>
    <text x="65" y="23" text-anchor="middle" fill="#7ee787" font-size="10" font-weight="bold">Stage Intents</text>
    <line x1="14" y1="33" x2="116" y2="33" stroke="#30363d"/>
    <text x="65" y="50" text-anchor="middle" fill="#8b949e" font-size="8">signal at close</text>
    <text x="65" y="64" text-anchor="middle" fill="#8b949e" font-size="8">next XNYS open only</text>
  </g>
  <line x1="620" y1="121" x2="637" y2="121" stroke="#30363d" stroke-width="1.5"/><polygon points="643,121 635,116 635,126" fill="#30363d"/>

  <g transform="translate(645,82)">
    <rect width="130" height="78" rx="8" fill="#1a2332" stroke="#d2a8ff" stroke-width="1.5"/>
    <text x="65" y="23" text-anchor="middle" fill="#d2a8ff" font-size="10" font-weight="bold">Project JSON</text>
    <line x1="14" y1="33" x2="116" y2="33" stroke="#30363d"/>
    <text x="65" y="50" text-anchor="middle" fill="#8b949e" font-size="8">read compatibility</text>
    <text x="65" y="64" text-anchor="middle" fill="#8b949e" font-size="8">never authority</text>
  </g>

  <g transform="translate(100,205)">
    <rect width="600" height="94" rx="8" fill="#0d1117" stroke="#30363d"/>
    <text x="300" y="23" text-anchor="middle" fill="#7d8590" font-size="10" font-weight="bold">AUTHORITATIVE STATE</text>
    <line x1="18" y1="33" x2="582" y2="33" stroke="#30363d"/>
    <text x="300" y="51" text-anchor="middle" fill="#e6edf3" font-size="9">one SQLite portfolio.db per dependent horizon/size scenario</text>
    <text x="300" y="68" text-anchor="middle" fill="#8b949e" font-size="8">signals, intents, fills, lots, marks, snapshots, benchmarks, explicit costs</text>
    <text x="300" y="83" text-anchor="middle" fill="#484f58" font-size="8">covered-call execution inactive</text>
  </g>
</svg>
